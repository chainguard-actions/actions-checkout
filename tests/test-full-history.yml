name: Test checkout with full history
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repository: actions/checkout
          ref: main
          path: checkout-full-history
          fetch-depth: 0
      - name: Assert outputs are set
        env:
          ACTUAL_REF: ${{ steps.action.outputs.ref }}
          ACTUAL_COMMIT: ${{ steps.action.outputs.commit }}
        run: |
          echo "actual ref: $ACTUAL_REF"
          echo "actual commit: $ACTUAL_COMMIT"
          if [ -z "$ACTUAL_REF" ]; then
            echo "FAIL: expected ref output to be non-empty"
            exit 1
          fi
          if [ -z "$ACTUAL_COMMIT" ]; then
            echo "FAIL: expected commit output to be non-empty"
            exit 1
          fi
          echo "PASS: outputs set correctly"
      - name: Assert full history was fetched (more than 1 commit)
        run: |
          cd "$GITHUB_WORKSPACE/checkout-full-history"
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "commit count: $COMMIT_COUNT"
          if [ "$COMMIT_COUNT" -le 1 ]; then
            echo "FAIL: expected more than 1 commit with fetch-depth=0, got $COMMIT_COUNT"
            exit 1
          fi
          echo "PASS: full history fetched with $COMMIT_COUNT commits"
