name: Test checkout of a different repository
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          repository: actions/toolkit
          ref: main
          fetch-depth: 1
          path: checkout-other

      - name: Assert checkout directory exists
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/checkout-other" ]; then
            echo "FAIL: checkout-other directory not found"
            exit 1
          fi
          echo "PASS: checkout-other directory exists"

      - name: Assert package.json exists (actions/toolkit root file)
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/checkout-other/package.json" ]; then
            echo "FAIL: package.json not found in checkout-other (actions/toolkit)"
            exit 1
          fi
          echo "PASS: package.json found in actions/toolkit checkout"

      - name: Assert commit output is a valid SHA
        env:
          ACTUAL: ${{ steps.action.outputs.commit }}
        run: |
          echo "actual commit: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: commit output is empty"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -qE '^[0-9a-f]{40}$'; then
            echo "FAIL: commit output does not look like a SHA: $ACTUAL"
            exit 1
          fi
          echo "PASS: commit output is a valid SHA"

      - name: Assert ref output is set
        env:
          ACTUAL: ${{ steps.action.outputs.ref }}
        run: |
          echo "actual ref: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: ref output is empty"
            exit 1
          fi
          echo "PASS: ref output is set"
