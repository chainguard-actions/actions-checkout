name: Test checkout with full history and tags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          repository: actions/checkout
          ref: main
          path: checkout-full
          fetch-depth: 0
          fetch-tags: true

      - name: Assert checkout directory exists
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/checkout-full" ]; then
            echo "FAIL: checkout-full directory not found"
            exit 1
          fi
          echo "PASS: checkout-full directory exists"

      - name: Assert full history is available
        run: |
          cd "$GITHUB_WORKSPACE/checkout-full"
          COUNT=$(git rev-list --count HEAD)
          echo "Commit count: $COUNT"
          if [ "$COUNT" -lt 2 ]; then
            echo "FAIL: expected more than 1 commit in full history"
            exit 1
          fi
          echo "PASS: git history has $COUNT commits"

      - name: Assert commit output is a valid SHA
        env:
          ACTUAL: ${{ steps.action.outputs.commit }}
        run: |
          echo "actual commit: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: commit output is empty"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -qE '^[0-9a-f]{40}$'; then
            echo "FAIL: commit output does not look like a SHA: $ACTUAL"
            exit 1
          fi
          echo "PASS: commit output is a valid SHA"

      - name: Assert ref output is set
        env:
          ACTUAL: ${{ steps.action.outputs.ref }}
        run: |
          echo "actual ref: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: ref output is empty"
            exit 1
          fi
          echo "PASS: ref output is set"
