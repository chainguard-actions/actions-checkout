name: Test checkout with full history (fetch-depth 0)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          repository: actions/checkout
          ref: main
          path: checkout-full
          fetch-depth: 0

      - name: Assert full history is present
        run: |
          echo "Checking git log depth..."
          COMMIT_COUNT=$(git -C "$GITHUB_WORKSPACE/checkout-full" rev-list --count HEAD)
          echo "Commit count: $COMMIT_COUNT"
          if [ "$COMMIT_COUNT" -lt 2 ]; then
            echo "FAIL: expected more than 1 commit with fetch-depth 0, got $COMMIT_COUNT"
            exit 1
          fi
          echo "PASS: full history present with $COMMIT_COUNT commits"

      - name: Assert checkout directory has expected files
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/checkout-full/action.yml" ]; then
            echo "FAIL: action.yml not found"
            exit 1
          fi
          echo "PASS: action.yml found"
