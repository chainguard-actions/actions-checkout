name: Test fetch-depth full history
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          repository: actions/checkout
          ref: main
          path: checkout-full
          fetch-depth: 0

      - name: Assert full history is present
        run: |
          echo "Checking git history depth..."
          cd "$GITHUB_WORKSPACE/checkout-full"
          COMMIT_COUNT=$(git log --oneline | wc -l | tr -d ' ')
          echo "commit count: $COMMIT_COUNT"
          if [ "$COMMIT_COUNT" -le 1 ]; then
            echo "FAIL: expected more than 1 commit in full history, got $COMMIT_COUNT"
            exit 1
          fi
          echo "PASS: full history has $COMMIT_COUNT commits"

      - name: Assert commit output is a valid SHA
        env:
          COMMIT: ${{ steps.action.outputs.commit }}
        run: |
          echo "commit: $COMMIT"
          if [ -z "$COMMIT" ]; then
            echo "FAIL: commit output is empty"
            exit 1
          fi
          if ! echo "$COMMIT" | grep -qE '^[0-9a-f]{40}$'; then
            echo "FAIL: commit output does not look like a SHA: $COMMIT"
            exit 1
          fi
          echo "PASS: commit output is a valid SHA"
