name: Test checkout with full history
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repository: actions/checkout
          ref: main
          path: checkout-full-history
          fetch-depth: 0
      - name: Assert full history is present
        run: |
          cd "$GITHUB_WORKSPACE/checkout-full-history"
          if ! git rev-parse --git-dir > /dev/null 2>&1; then
            echo "FAIL: checkout-full-history is not a valid git repository"
            exit 1
          fi
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "Total commits: $COMMIT_COUNT"
          if [ "$COMMIT_COUNT" -lt 2 ]; then
            echo "FAIL: expected more than 1 commit with fetch-depth=0, got $COMMIT_COUNT"
            exit 1
          fi
          echo "PASS: full history present with $COMMIT_COUNT commits"
      - name: Assert shallow clone is NOT present
        run: |
          cd "$GITHUB_WORKSPACE/checkout-full-history"
          if [ -f ".git/shallow" ] && [ -s ".git/shallow" ]; then
            echo "FAIL: .git/shallow file is non-empty, indicating a shallow clone"
            exit 1
          fi
          echo "PASS: not a shallow clone"
