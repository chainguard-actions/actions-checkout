name: Test checkout with full history
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repository: actions/hello-world-javascript-action
          ref: main
          path: full-history-checkout
          fetch-depth: 0
      - name: Assert full history is available
        run: |
          COMMIT_COUNT=$(git -C "$GITHUB_WORKSPACE/full-history-checkout" rev-list --count HEAD)
          echo "commit count: $COMMIT_COUNT"
          if [ "$COMMIT_COUNT" -lt 2 ]; then
            echo "FAIL: expected more than 1 commit in full history (got $COMMIT_COUNT)"
            exit 1
          fi
          echo "PASS: full history fetched with $COMMIT_COUNT commits"
      - name: Assert commit output is set
        env:
          COMMIT: ${{ steps.action.outputs.commit }}
        run: |
          echo "commit: $COMMIT"
          if [ -z "$COMMIT" ]; then
            echo "FAIL: expected commit output to be non-empty"
            exit 1
          fi
          echo "PASS: commit output is '$COMMIT'"
