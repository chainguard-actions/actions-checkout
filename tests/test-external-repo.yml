name: Test checkout external repository at specific ref
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repository: actions/checkout
          ref: v4.2.2
          path: checkout-external
          fetch-depth: 1
      - name: Assert commit output is set
        env:
          COMMIT: ${{ steps.action.outputs.commit }}
        run: |
          echo "commit: $COMMIT"
          if [ -z "$COMMIT" ]; then
            echo "FAIL: commit output is empty"
            exit 1
          fi
          # Verify it looks like a SHA (40 hex chars)
          if ! echo "$COMMIT" | grep -qE '^[0-9a-f]{40}$'; then
            echo "FAIL: commit '$COMMIT' does not look like a full SHA"
            exit 1
          fi
          echo "PASS: commit output is a valid SHA"
      - name: Assert ref output is set
        env:
          REF: ${{ steps.action.outputs.ref }}
        run: |
          echo "ref: $REF"
          if [ -z "$REF" ]; then
            echo "FAIL: ref output is empty"
            exit 1
          fi
          echo "PASS: ref output is set"
      - name: Assert external repo was checked out
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/checkout-external" ]; then
            echo "FAIL: checkout-external directory not found"
            exit 1
          fi
          echo "PASS: checkout-external directory exists"
          # actions/checkout has an action.yml at root
          if [ ! -f "$GITHUB_WORKSPACE/checkout-external/action.yml" ]; then
            echo "FAIL: action.yml not found in checkout-external"
            ls -la "$GITHUB_WORKSPACE/checkout-external/" || true
            exit 1
          fi
          echo "PASS: external repo checked out successfully (action.yml found)"
      - name: Assert it is a valid git repo
        run: |
          cd "$GITHUB_WORKSPACE/checkout-external"
          if ! git rev-parse --git-dir > /dev/null 2>&1; then
            echo "FAIL: not a git repository"
            exit 1
          fi
          echo "PASS: is a valid git repository"
          # With fetch-depth: 1, should be a shallow clone
          IS_SHALLOW=$(git rev-parse --is-shallow-repository 2>/dev/null || echo "unknown")
          echo "is-shallow: $IS_SHALLOW"
          if [ "$IS_SHALLOW" = "true" ]; then
            echo "PASS: repository is shallow as expected with fetch-depth: 1"
          else
            echo "INFO: repository is not shallow (is-shallow=$IS_SHALLOW)"
          fi
