name: Test checkout at specific ref
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Checkout actions/checkout at a specific known tag
        id: action
        uses: .
        with:
          repository: actions/checkout
          ref: v4.2.2
          path: ref-target

      - name: Assert checkout directory exists
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/ref-target" ]; then
            echo "FAIL: ref-target directory not found"
            exit 1
          fi
          echo "PASS: ref-target directory exists"

      - name: Assert action.yml exists
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/ref-target/action.yml" ]; then
            echo "FAIL: action.yml not found in ref-target"
            exit 1
          fi
          echo "PASS: action.yml found"

      - name: Assert commit output is set and is a valid SHA
        env:
          COMMIT: ${{ steps.action.outputs.commit }}
        run: |
          echo "commit: $COMMIT"
          if [ -z "$COMMIT" ]; then
            echo "FAIL: commit output is empty"
            exit 1
          fi
          if ! echo "$COMMIT" | grep -qE '^[0-9a-f]{40}$'; then
            echo "FAIL: commit output does not look like a SHA: $COMMIT"
            exit 1
          fi
          echo "PASS: commit output is a valid SHA"

      - name: Assert ref output is set
        env:
          REF: ${{ steps.action.outputs.ref }}
        run: |
          echo "ref: $REF"
          if [ -z "$REF" ]; then
            echo "FAIL: ref output is empty"
            exit 1
          fi
          echo "PASS: ref output is set"

      - name: Assert checked-out content matches the expected tag
        run: |
          cd "$GITHUB_WORKSPACE/ref-target"
          # The tag v4.2.2 should be checked out; verify git log shows the right commit
          ACTUAL_SHA=$(git rev-parse HEAD)
          echo "HEAD SHA: $ACTUAL_SHA"
          if [ -z "$ACTUAL_SHA" ]; then
            echo "FAIL: could not determine HEAD SHA"
            exit 1
          fi
          echo "PASS: HEAD SHA is $ACTUAL_SHA"
