name: Test checkout at specific ref (SHA)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          repository: actions/checkout
          # Pin to a known commit SHA for reproducibility
          ref: de0fac2e4500dabe0009e67214ff5f5447ce83dd
          path: checkout-sha
          fetch-depth: 1

      - name: Assert checkout directory exists
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/checkout-sha" ]; then
            echo "FAIL: checkout-sha directory not found"
            exit 1
          fi
          echo "PASS: checkout-sha directory exists"

      - name: Assert action.yml exists in checked-out repo
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/checkout-sha/action.yml" ]; then
            echo "FAIL: action.yml not found in checkout-sha"
            exit 1
          fi
          echo "PASS: action.yml found"

      - name: Assert commit output matches the requested SHA
        env:
          COMMIT: ${{ steps.action.outputs.commit }}
        run: |
          echo "commit: $COMMIT"
          EXPECTED="de0fac2e4500dabe0009e67214ff5f5447ce83dd"
          if [ "$COMMIT" != "$EXPECTED" ]; then
            echo "FAIL: expected commit $EXPECTED but got $COMMIT"
            exit 1
          fi
          echo "PASS: commit output matches expected SHA"
