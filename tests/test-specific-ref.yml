name: Test checkout specific ref
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repository: actions/checkout
          ref: main
          path: checkout-ref-output
      - name: Assert checkout directory exists
        run: |
          echo "Checking checkout-ref-output directory..."
          if [ ! -d "$GITHUB_WORKSPACE/checkout-ref-output" ]; then
            echo "FAIL: checkout-ref-output directory not found"
            exit 1
          fi
          echo "PASS: checkout-ref-output directory exists"
      - name: Assert action.yml is present
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/checkout-ref-output/action.yml" ]; then
            echo "FAIL: action.yml not found in checkout-ref-output"
            exit 1
          fi
          echo "PASS: action.yml found"
      - name: Assert commit output is a valid SHA
        env:
          COMMIT: ${{ steps.action.outputs.commit }}
        run: |
          echo "commit: $COMMIT"
          if [ -z "$COMMIT" ]; then
            echo "FAIL: commit output is empty"
            exit 1
          fi
          if ! echo "$COMMIT" | grep -qE '^[0-9a-f]{40}$'; then
            echo "FAIL: commit output does not look like a SHA: $COMMIT"
            exit 1
          fi
          echo "PASS: commit output is a valid SHA"
      - name: Assert ref output is set
        env:
          REF: ${{ steps.action.outputs.ref }}
        run: |
          echo "ref: $REF"
          if [ -z "$REF" ]; then
            echo "FAIL: ref output is empty"
            exit 1
          fi
          echo "PASS: ref output is set"
      - name: Assert checked out branch is main
        run: |
          cd "$GITHUB_WORKSPACE/checkout-ref-output"
          BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "")
          echo "branch: $BRANCH"
          if [ "$BRANCH" != "main" ]; then
            echo "FAIL: expected branch 'main', got '$BRANCH'"
            exit 1
          fi
          echo "PASS: checked out on main branch"
