name: Test checkout by specific SHA
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Checkout a known stable SHA from actions/checkout (v4.4.0 tag)
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: actions/checkout
          ref: 11bd71901bbe5b1630ceea73d27597364c9af683
          path: checkout-sha
          persist-credentials: false

      - name: Assert SHA checkout or graceful failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COMMIT: ${{ steps.action.outputs.commit }}
          REF: ${{ steps.action.outputs.ref }}
        run: |
          echo "outcome: $OUTCOME"
          echo "commit: $COMMIT"
          echo "ref: $REF"
          if [ "$OUTCOME" = "success" ]; then
            # Verify checkout directory exists
            if [ ! -d "$GITHUB_WORKSPACE/checkout-sha" ]; then
              echo "FAIL: checkout-sha directory not found"
              exit 1
            fi
            # Verify commit output matches requested SHA
            EXPECTED="11bd71901bbe5b1630ceea73d27597364c9af683"
            if [ -z "$COMMIT" ]; then
              echo "FAIL: commit output is empty"
              exit 1
            fi
            if [ "$COMMIT" != "$EXPECTED" ]; then
              echo "FAIL: expected commit $EXPECTED but got $COMMIT"
              exit 1
            fi
            echo "PASS: commit output matches requested SHA: $COMMIT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network or sentinel repo issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
