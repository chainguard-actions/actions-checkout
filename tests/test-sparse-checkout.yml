name: Test sparse checkout
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Sparse checkout: only get the .github directory from a known repo
      - id: action
        uses: .
        with:
          repository: actions/checkout
          ref: main
          path: sparse-checkout-target
          sparse-checkout: |
            .github
          sparse-checkout-cone-mode: true

      - name: Assert directory exists
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/sparse-checkout-target" ]; then
            echo "FAIL: sparse-checkout-target directory not found"
            exit 1
          fi
          echo "PASS: directory exists"

      - name: Assert .github directory was checked out
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/sparse-checkout-target/.github" ]; then
            echo "FAIL: .github directory not found in sparse checkout"
            exit 1
          fi
          echo "PASS: .github directory found in sparse checkout"

      - name: Assert commit output is set
        env:
          COMMIT: ${{ steps.action.outputs.commit }}
        run: |
          echo "commit: $COMMIT"
          if [ -z "$COMMIT" ]; then
            echo "FAIL: commit output is empty"
            exit 1
          fi
          if ! echo "$COMMIT" | grep -qE '^[0-9a-f]{40}$'; then
            echo "FAIL: commit output does not look like a SHA: $COMMIT"
            exit 1
          fi
          echo "PASS: commit output is a valid SHA"
