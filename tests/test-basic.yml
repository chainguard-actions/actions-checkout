name: Test basic checkout
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repository: actions/checkout
          ref: main
          path: checkout-output
      - name: Assert checkout succeeded
        run: |
          echo "Checking for checked-out files..."
          if [ ! -d "$GITHUB_WORKSPACE/checkout-output" ]; then
            echo "FAIL: checkout-output directory does not exist"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/checkout-output/action.yml" ]; then
            echo "FAIL: action.yml not found in checked-out repo"
            exit 1
          fi
          echo "PASS: checkout succeeded, action.yml found"
