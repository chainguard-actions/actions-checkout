name: Test basic checkout
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: actions/checkout
          ref: main
          path: checkout-target
          persist-credentials: false

      - name: Assert checkout succeeded or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COMMIT: ${{ steps.action.outputs.commit }}
          REF: ${{ steps.action.outputs.ref }}
        run: |
          echo "outcome: $OUTCOME"
          echo "commit: $COMMIT"
          echo "ref: $REF"
          if [ "$OUTCOME" = "success" ]; then
            # Verify the checkout directory exists
            if [ ! -d "$GITHUB_WORKSPACE/checkout-target" ]; then
              echo "FAIL: checkout-target directory not found"
              exit 1
            fi
            # Verify action.yml was checked out
            if [ ! -f "$GITHUB_WORKSPACE/checkout-target/action.yml" ]; then
              echo "FAIL: action.yml not found in checkout-target"
              exit 1
            fi
            # Verify commit output looks like a SHA
            if [ -z "$COMMIT" ]; then
              echo "FAIL: commit output is empty"
              exit 1
            fi
            if ! echo "$COMMIT" | grep -qE '^[0-9a-f]{40}$'; then
              echo "FAIL: commit output does not look like a SHA: $COMMIT"
              exit 1
            fi
            # Verify ref output is set
            if [ -z "$REF" ]; then
              echo "FAIL: ref output is empty"
              exit 1
            fi
            echo "PASS: checkout succeeded with commit=$COMMIT ref=$REF"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network or sentinel repo issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
