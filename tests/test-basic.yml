name: Test basic checkout
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repository: actions/checkout
          ref: main
          path: checkout-basic
          fetch-depth: 1
      - name: Assert commit output is set
        env:
          COMMIT: ${{ steps.action.outputs.commit }}
        run: |
          echo "commit: $COMMIT"
          if [ -z "$COMMIT" ]; then
            echo "FAIL: commit output is empty"
            exit 1
          fi
          # Verify it looks like a SHA (40 hex chars)
          if ! echo "$COMMIT" | grep -qE '^[0-9a-f]{40}$'; then
            echo "FAIL: commit '$COMMIT' does not look like a full SHA"
            exit 1
          fi
          echo "PASS: commit output is a valid SHA"
      - name: Assert ref output is set
        env:
          REF: ${{ steps.action.outputs.ref }}
        run: |
          echo "ref: $REF"
          if [ -z "$REF" ]; then
            echo "FAIL: ref output is empty"
            exit 1
          fi
          echo "PASS: ref output is set"
      - name: Assert checkout directory exists and is a git repo
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/checkout-basic" ]; then
            echo "FAIL: checkout-basic directory not found"
            exit 1
          fi
          echo "PASS: checkout-basic directory exists"
          cd "$GITHUB_WORKSPACE/checkout-basic"
          if ! git rev-parse --git-dir > /dev/null 2>&1; then
            echo "FAIL: checkout-basic is not a git repository"
            exit 1
          fi
          echo "PASS: checkout-basic is a valid git repository"
      - name: Assert checked-out repo has action.yml
        run: |
          cd "$GITHUB_WORKSPACE/checkout-basic"
          echo "Contents of checkout-basic:"
          ls -la
          # actions/checkout has action.yml at root
          if [ ! -f "action.yml" ]; then
            echo "FAIL: action.yml not found in checkout-basic"
            ls -la || true
            exit 1
          fi
          echo "PASS: action.yml found in checkout-basic"
