name: Test checkout without persisting credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repository: actions/checkout
          ref: main
          persist-credentials: false
          path: checkout-no-creds
      - name: Assert checkout directory exists
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/checkout-no-creds" ]; then
            echo "FAIL: checkout-no-creds directory not found"
            exit 1
          fi
          echo "PASS: checkout-no-creds directory exists"
      - name: Assert action.yml is present
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/checkout-no-creds/action.yml" ]; then
            echo "FAIL: action.yml not found in checkout-no-creds"
            exit 1
          fi
          echo "PASS: action.yml found"
      - name: Assert no token in git config
        run: |
          cd "$GITHUB_WORKSPACE/checkout-no-creds"
          # With persist-credentials=false, the extraheader should not be set
          HEADER=$(git config --local http.https://github.com/.extraheader 2>/dev/null || echo "")
          echo "extraheader: '$HEADER'"
          if [ -n "$HEADER" ]; then
            echo "FAIL: credentials were persisted despite persist-credentials=false"
            exit 1
          fi
          echo "PASS: no credentials persisted in git config"
      - name: Assert commit output is a valid SHA
        env:
          COMMIT: ${{ steps.action.outputs.commit }}
        run: |
          echo "commit: $COMMIT"
          if [ -z "$COMMIT" ]; then
            echo "FAIL: commit output is empty"
            exit 1
          fi
          if ! echo "$COMMIT" | grep -qE '^[0-9a-f]{40}$'; then
            echo "FAIL: commit output does not look like a SHA: $COMMIT"
            exit 1
          fi
          echo "PASS: commit output is a valid SHA"
