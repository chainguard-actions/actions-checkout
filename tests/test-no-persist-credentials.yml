name: Test persist-credentials false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repository: actions/checkout
          ref: main
          path: checkout-no-creds
          persist-credentials: false
      - name: Assert checkout succeeded without persisted credentials
        run: |
          echo "Checking checkout directory..."
          if [ ! -d "$GITHUB_WORKSPACE/checkout-no-creds" ]; then
            echo "FAIL: checkout-no-creds directory does not exist"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/checkout-no-creds/action.yml" ]; then
            echo "FAIL: action.yml not found in checked-out repo"
            exit 1
          fi
          echo "Checking that no credential helper is configured..."
          cd "$GITHUB_WORKSPACE/checkout-no-creds"
          CRED_HELPER=$(git config --local credential.helper || true)
          echo "credential.helper: '$CRED_HELPER'"
          if [ -n "$CRED_HELPER" ]; then
            echo "FAIL: expected no local credential helper when persist-credentials is false"
            exit 1
          fi
          echo "PASS: checkout succeeded and no credentials persisted"
