name: Test checkout without persisting credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          repository: actions/hello-world-javascript-action
          ref: main
          path: no-creds-checkout
          persist-credentials: false

      - name: Assert directory exists
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/no-creds-checkout" ]; then
            echo "FAIL: no-creds-checkout directory not found"
            exit 1
          fi
          echo "PASS: directory exists"

      - name: Assert action.yml exists in checkout
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/no-creds-checkout/action.yml" ]; then
            echo "FAIL: action.yml not found in checked-out repo"
            exit 1
          fi
          echo "PASS: action.yml found"

      - name: Assert no token in git config
        run: |
          cd "$GITHUB_WORKSPACE/no-creds-checkout"
          # With persist-credentials=false, the token should not be in the git config
          TOKEN_IN_CONFIG=$(git config --local http.https://github.com/.extraheader 2>/dev/null || echo "")
          echo "token in config: '$TOKEN_IN_CONFIG'"
          if [ -n "$TOKEN_IN_CONFIG" ]; then
            echo "FAIL: credentials were persisted despite persist-credentials=false"
            exit 1
          fi
          echo "PASS: no credentials persisted in git config"

      - name: Assert commit output is set
        env:
          COMMIT: ${{ steps.action.outputs.commit }}
        run: |
          echo "commit: $COMMIT"
          if [ -z "$COMMIT" ]; then
            echo "FAIL: commit output is empty"
            exit 1
          fi
          if ! echo "$COMMIT" | grep -qE '^[0-9a-f]{40}$'; then
            echo "FAIL: commit output does not look like a SHA: $COMMIT"
            exit 1
          fi
          echo "PASS: commit output is a valid SHA"
