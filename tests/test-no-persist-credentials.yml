name: Test checkout without persisting credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Checkout without persisting credentials
        id: action
        uses: .
        with:
          repository: actions/checkout
          ref: main
          path: no-creds-target
          persist-credentials: false

      - name: Assert checkout directory exists
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/no-creds-target" ]; then
            echo "FAIL: no-creds-target directory not found"
            exit 1
          fi
          echo "PASS: no-creds-target directory exists"

      - name: Assert action.yml exists in checked-out repo
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/no-creds-target/action.yml" ]; then
            echo "FAIL: action.yml not found in no-creds-target"
            exit 1
          fi
          echo "PASS: action.yml found"

      - name: Assert no token is stored in git config
        run: |
          cd "$GITHUB_WORKSPACE/no-creds-target"
          # With persist-credentials=false, the token should not be in git config
          TOKEN_IN_CONFIG=$(git config --local http.https://github.com/.extraheader 2>/dev/null || echo "")
          echo "token in config: '$TOKEN_IN_CONFIG'"
          if [ -n "$TOKEN_IN_CONFIG" ]; then
            echo "FAIL: token found in git config despite persist-credentials=false"
            exit 1
          fi
          echo "PASS: no token stored in git config"

      - name: Assert commit output is a valid SHA
        env:
          COMMIT: ${{ steps.action.outputs.commit }}
        run: |
          echo "commit: $COMMIT"
          if [ -z "$COMMIT" ]; then
            echo "FAIL: commit output is empty"
            exit 1
          fi
          if ! echo "$COMMIT" | grep -qE '^[0-9a-f]{40}$'; then
            echo "FAIL: commit output does not look like a SHA: $COMMIT"
            exit 1
          fi
          echo "PASS: commit output is a valid SHA"
