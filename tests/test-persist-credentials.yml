name: Test checkout with persist-credentials false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repository: actions/checkout
          ref: main
          persist-credentials: false
          path: checkout-no-creds
          fetch-depth: 1
      - name: Assert commit output is set
        env:
          COMMIT: ${{ steps.action.outputs.commit }}
        run: |
          echo "commit: $COMMIT"
          if [ -z "$COMMIT" ]; then
            echo "FAIL: commit output is empty"
            exit 1
          fi
          # Verify it looks like a SHA (40 hex chars)
          if ! echo "$COMMIT" | grep -qE '^[0-9a-f]{40}$'; then
            echo "FAIL: commit '$COMMIT' does not look like a full SHA"
            exit 1
          fi
          echo "PASS: commit output is a valid SHA"
      - name: Assert checkout directory exists and is a git repo
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/checkout-no-creds" ]; then
            echo "FAIL: checkout-no-creds directory not found"
            exit 1
          fi
          echo "PASS: checkout-no-creds directory exists"
          cd "$GITHUB_WORKSPACE/checkout-no-creds"
          if ! git rev-parse --git-dir > /dev/null 2>&1; then
            echo "FAIL: not a git repository"
            exit 1
          fi
          echo "PASS: is a valid git repository"
      - name: Assert no token in git config when persist-credentials is false
        run: |
          cd "$GITHUB_WORKSPACE/checkout-no-creds"
          # When persist-credentials is false, the extraheader should not be set
          HEADER=$(git config --local http.https://github.com/.extraheader 2>/dev/null || echo "")
          echo "extraheader: '$HEADER'"
          if [ -n "$HEADER" ]; then
            echo "FAIL: extraheader is set but persist-credentials was false"
            exit 1
          fi
          echo "PASS: no extraheader in local git config (credentials not persisted)"
