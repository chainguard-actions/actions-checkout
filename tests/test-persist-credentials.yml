name: Test checkout with persist-credentials false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          repository: actions/checkout
          ref: main
          path: checkout-no-creds
          persist-credentials: false

      - name: Assert checkout directory exists
        run: |
          echo "Checking checkout-no-creds directory..."
          if [ ! -d "$GITHUB_WORKSPACE/checkout-no-creds" ]; then
            echo "FAIL: checkout-no-creds directory not found"
            exit 1
          fi
          echo "PASS: directory exists"

      - name: Assert action.yml is present
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/checkout-no-creds/action.yml" ]; then
            echo "FAIL: action.yml not found"
            exit 1
          fi
          echo "PASS: action.yml found"

      - name: Assert no token stored in git config
        run: |
          echo "Checking git config for stored credentials..."
          EXTRA_HEADER=$(git -C "$GITHUB_WORKSPACE/checkout-no-creds" config --local http.https://github.com/.extraheader 2>/dev/null || echo "")
          echo "extraheader: '$EXTRA_HEADER'"
          if [ -n "$EXTRA_HEADER" ]; then
            echo "FAIL: credentials were persisted in git config despite persist-credentials: false"
            exit 1
          fi
          echo "PASS: no credentials stored in git config"
