name: Test persist-credentials false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          repository: actions/checkout
          ref: main
          path: checkout-nocreds
          persist-credentials: false

      - name: Assert checkout directory exists
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/checkout-nocreds" ]; then
            echo "FAIL: checkout-nocreds directory not found"
            exit 1
          fi
          echo "PASS: directory exists"

      - name: Assert no token stored in git config
        run: |
          cd "$GITHUB_WORKSPACE/checkout-nocreds"
          # With persist-credentials: false, the extraheader should not be set
          HEADER=$(git config --local http.https://github.com/.extraheader 2>/dev/null || echo "")
          echo "extraheader: '$HEADER'"
          if [ -n "$HEADER" ]; then
            echo "FAIL: extraheader is set — credentials were persisted despite persist-credentials: false"
            exit 1
          fi
          echo "PASS: no credentials persisted in git config"

      - name: Assert action.yml is present
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/checkout-nocreds/action.yml" ]; then
            echo "FAIL: action.yml not found"
            exit 1
          fi
          echo "PASS: action.yml found"
