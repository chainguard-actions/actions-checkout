name: Licensed

on:
  push: {branches: main}
  pull_request: {branches: main}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: Check licenses
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - run: npm ci
      - run: npm run licensed-check
